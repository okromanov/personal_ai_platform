<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Personal AI Platform — architecture and entity hierarchy</title>
  <desc id="desc">Architecture overview with owner control, orchestration, model and tool gateways, platform services, and the hierarchy Capability to Skill to Tool to Implementation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#253a77"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dy="7" result="offsetBlur"/>
      <feFlood flood-color="#0f172a" flood-opacity="0.12" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadowBlur"/>
      <feMerge><feMergeNode in="shadowBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset in="blur" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#0f172a" flood-opacity="0.09" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadowBlur"/>
      <feMerge><feMergeNode in="shadowBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowNavy" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
    <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0f9f9a"/>
    </marker>
    <marker id="arrowViolet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7c5ce7"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #15203b; }
      .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 2.1px; fill: #52627a; }
      .title { font-size: 35px; font-weight: 850; letter-spacing: -0.6px; fill: #102047; }
      .subtitle { font-size: 15px; font-weight: 500; fill: #61708a; }
      .section { font-size: 12px; font-weight: 850; letter-spacing: 1.8px; fill: #66758c; }
      .cardTitle { font-size: 17px; font-weight: 800; fill: #172554; }
      .cardText { font-size: 12px; font-weight: 500; fill: #5b6b82; }
      .tiny { font-size: 10.5px; font-weight: 650; fill: #68778d; }
      .tag { font-size: 10px; font-weight: 800; letter-spacing: 0.8px; }
      .white { fill: white; }
      .mutedWhite { fill: #cbd7f0; }
      .connector { fill: none; stroke: #334155; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowNavy); }
      .connectorSoft { fill: none; stroke: #94a3b8; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowNavy); }
      .hierarchy { fill: none; stroke: #0f9f9a; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowTeal); }
      .hierarchyViolet { fill: none; stroke: #7c5ce7; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowViolet); }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>
  <circle cx="1500" cy="80" r="210" fill="#dff2ff" opacity="0.46"/>
  <circle cx="80" cy="1080" r="260" fill="#e9e5ff" opacity="0.44"/>

  <!-- Header -->
  <g transform="translate(70 54)">
    <text class="eyebrow" x="0" y="0">ARCHITECTURE MAP · V1</text>
    <text class="title" x="0" y="46">Personal AI Platform</text>
    <text class="subtitle" x="0" y="76">Owner-controlled orchestration with reusable, platform-independent capabilities</text>
  </g>
  <g transform="translate(1242 52)">
    <rect x="0" y="0" width="288" height="70" rx="18" fill="#ffffff" stroke="#d8e2ef"/>
    <circle cx="34" cy="35" r="15" fill="#dcfce7"/>
    <path d="M27 35 l5 5 10-12" fill="none" stroke="#16845b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="61" y="30" font-size="11" font-weight="800" fill="#16845b">DESIGN RULE</text>
    <text x="61" y="49" font-size="12" font-weight="700" fill="#334155">Owner authority stays external</text>
  </g>

  <!-- Owner contour -->
  <text class="section" x="70" y="158">01 · OWNER CONTROL PLANE</text>
  <rect x="70" y="176" width="1460" height="124" rx="24" fill="#fff" stroke="#d8e2ef"/>
  <g transform="translate(95 199)">
    <rect x="0" y="0" width="245" height="78" rx="18" fill="#fff4f5" stroke="#fecdd3"/>
    <circle cx="36" cy="39" r="18" fill="#fb7185"/>
    <path d="M28 41 h16 M36 33 v16" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/>
    <text class="cardTitle" x="66" y="32">Owner</text>
    <text class="cardText" x="66" y="53">identity · rules · consent</text>
  </g>
  <path class="connector" d="M340 238 H420"/>
  <g transform="translate(420 199)">
    <rect x="0" y="0" width="352" height="78" rx="18" fill="#fff8ed" stroke="#fed7aa"/>
    <rect x="20" y="17" width="44" height="44" rx="13" fill="#f59e0b"/>
    <path d="M32 39 h20 M42 29 v20" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/>
    <text class="cardTitle" x="82" y="32">Owner Control</text>
    <text class="cardText" x="82" y="53">policy checks before start and sensitive action</text>
  </g>
  <path class="connector" d="M772 238 H850"/>
  <g transform="translate(850 199)">
    <rect x="0" y="0" width="276" height="78" rx="18" fill="#fff4f5" stroke="#fecdd3"/>
    <circle cx="38" cy="39" r="20" fill="#e11d48"/>
    <path d="M30 31 l16 16 M46 31 L30 47" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <text class="cardTitle" x="74" y="32">Emergency Switch</text>
    <text class="cardText" x="74" y="53">preempts runtime, retries and tools</text>
  </g>
  <g transform="translate(1174 199)">
    <rect x="0" y="0" width="330" height="78" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="tag" x="20" y="25" fill="#64748b">SECURITY INVARIANT</text>
    <text x="20" y="48" font-size="12" font-weight="700" fill="#334155">Text instructions never grant authority.</text>
    <text class="tiny" x="20" y="64">Capabilities are explicitly scoped and revocable.</text>
  </g>

  <!-- Main runtime -->
  <text class="section" x="70" y="340">02 · REQUEST AND EXECUTION PATH</text>
  <g>
    <rect x="70" y="360" width="250" height="158" rx="24" fill="#ffffff" stroke="#d8e2ef"/>
    <rect x="92" y="382" width="48" height="48" rx="15" fill="#dff4ff"/>
    <path d="M105 407 l23-10-7 25-6-8-6 5z" fill="#2687b7"/>
    <text class="tag" x="158" y="397" fill="#2687b7">CHANNEL</text>
    <text class="cardTitle" x="158" y="421">Telegram</text>
    <text class="cardText" x="92" y="458">Normalizes owner input/output.</text>
    <text class="cardText" x="92" y="478">No business logic or tool authority.</text>
    <rect x="92" y="491" width="137" height="21" rx="10" fill="#eff6ff"/>
    <text class="tiny" x="104" y="505" fill="#2563eb">inbound / outbound</text>
  </g>

  <path class="connector" d="M320 439 H388"/>

  <g>
    <rect x="388" y="344" width="512" height="190" rx="28" fill="url(#hero)"/>
    <text class="tag white" x="420" y="377">ORCHESTRATION CORE</text>
    <text x="420" y="412" font-size="23" font-weight="850" class="white">Orchestration + RuntimePort</text>
    <text x="420" y="438" font-size="13" font-weight="500" class="mutedWhite">Turns an approved task into an executable loop.</text>
    <line x1="420" y1="458" x2="868" y2="458" stroke="#496099"/>
    <g transform="translate(420 476)">
      <rect x="0" y="0" width="132" height="34" rx="12" fill="#314980"/>
      <text x="18" y="22" font-size="11" font-weight="750" class="white">task plan</text>
      <rect x="146" y="0" width="132" height="34" rx="12" fill="#314980"/>
      <text x="164" y="22" font-size="11" font-weight="750" class="white">context budget</text>
      <rect x="292" y="0" width="144" height="34" rx="12" fill="#314980"/>
      <text x="310" y="22" font-size="11" font-weight="750" class="white">stable adapter</text>
    </g>
  </g>

  <path class="connector" d="M900 402 H968"/>
  <g>
    <rect x="968" y="360" width="254" height="158" rx="24" fill="#ffffff" stroke="#d8e2ef"/>
    <rect x="990" y="382" width="48" height="48" rx="15" fill="#ede9fe"/>
    <circle cx="1014" cy="406" r="10" fill="none" stroke="#7254d8" stroke-width="2.2"/>
    <path d="M1007 406 h14 M1014 399 v14" stroke="#7254d8" stroke-width="2" stroke-linecap="round"/>
    <text class="tag" x="1056" y="397" fill="#7254d8">MODEL GATEWAY</text>
    <text class="cardTitle" x="1056" y="421">Model Provider</text>
    <text class="cardText" x="990" y="458">Normalized requests, responses</text>
    <text class="cardText" x="990" y="478">and errors; provider replaceable.</text>
    <rect x="990" y="491" width="144" height="21" rx="10" fill="#f5f3ff"/>
    <text class="tiny" x="1002" y="505" fill="#6d4fd0">implementation adapter</text>
  </g>

  <path class="connector" d="M1222 439 H1290"/>
  <g>
    <rect x="1290" y="360" width="240" height="158" rx="24" fill="#ffffff" stroke="#d8e2ef"/>
    <rect x="1312" y="382" width="48" height="48" rx="15" fill="#dcfce7"/>
    <path d="M1327 404 h18 M1336 395 v18" stroke="#14815c" stroke-width="2.3" stroke-linecap="round"/>
    <text class="tag" x="1378" y="397" fill="#14815c">QUALITY</text>
    <text class="cardTitle" x="1378" y="421">Verification</text>
    <text class="cardText" x="1312" y="458">Deterministic checks, review</text>
    <text class="cardText" x="1312" y="478">and model evaluation when useful.</text>
    <text class="tiny" x="1312" y="505">quality never grants authority</text>
  </g>

  <!-- Entity hierarchy -->
  <text class="section" x="70" y="582">03 · PROJECT ENTITY HIERARCHY</text>
  <rect x="70" y="602" width="960" height="416" rx="28" fill="#ffffff" stroke="#d8e2ef"/>
  <g transform="translate(98 628)">
    <text x="0" y="0" font-size="20" font-weight="850" fill="#172554">Reusable Capability Layer</text>
    <text x="0" y="24" font-size="12" font-weight="550" fill="#68778d">Stable owner need → reusable workflow → authorized atomic operation → replaceable concrete adapter</text>
  </g>

  <!-- Capability -->
  <g transform="translate(110 684)">
    <rect x="0" y="0" width="250" height="76" rx="18" fill="#e7fbfa" stroke="#59c7c2" stroke-width="1.5"/>
    <rect x="16" y="16" width="44" height="44" rx="13" fill="#0f9f9a"/>
    <circle cx="38" cy="38" r="11" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M38 27 v22 M27 38 h22" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text class="tag" x="76" y="28" fill="#087c78">CAPABILITY</text>
    <text x="76" y="51" font-size="14" font-weight="800" fill="#155e75">Stable owner need</text>
  </g>

  <path class="hierarchy" d="M235 760 V772"/>
  <text x="254" y="771" font-size="10.5" font-weight="800" fill="#0f9f9a">1 → N</text>

  <!-- Skills group -->
  <g transform="translate(92 776)">
    <rect x="0" y="0" width="286" height="76" rx="20" fill="#f3efff" stroke="#9b87ee" stroke-width="1.5"/>
    <text class="tag" x="18" y="25" fill="#7254d8">SKILLS · REUSABLE WORKFLOWS</text>
    <rect x="18" y="39" width="76" height="29" rx="10" fill="#7c5ce7"/>
    <text x="39" y="58" font-size="10.5" font-weight="800" class="white">Skill A</text>
    <rect x="104" y="39" width="76" height="29" rx="10" fill="#8b6bea"/>
    <text x="125" y="58" font-size="10.5" font-weight="800" class="white">Skill B</text>
    <rect x="190" y="39" width="76" height="29" rx="10" fill="#9b80ed"/>
    <text x="211" y="58" font-size="10.5" font-weight="800" class="white">Skill C</text>
  </g>

  <path class="hierarchyViolet" d="M235 852 V865"/>

  <!-- Tool -->
  <g transform="translate(110 868)">
    <rect x="0" y="0" width="250" height="54" rx="16" fill="#fff7e8" stroke="#f4b64f" stroke-width="1.5"/>
    <rect x="16" y="9" width="36" height="36" rx="11" fill="#f59e0b"/>
    <path d="M26 27 h16 M34 19 v16" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <text class="tag" x="68" y="22" fill="#b66a00">TOOL</text>
    <text x="68" y="40" font-size="12.5" font-weight="800" fill="#92400e">Authorized atomic operation</text>
  </g>

  <path class="hierarchy" d="M235 922 V935"/>

  <!-- Implementation -->
  <g transform="translate(110 938)">
    <rect x="0" y="0" width="250" height="54" rx="16" fill="#eff4fa" stroke="#a9b8ca" stroke-width="1.5"/>
    <rect x="16" y="9" width="36" height="36" rx="11" fill="#64748b"/>
    <path d="M27 21 l-5 6 5 6 M41 21 l5 6-5 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="tag" x="68" y="22" fill="#526175">IMPLEMENTATION</text>
    <text x="68" y="40" font-size="12.5" font-weight="800" fill="#334155">API · MCP · library · provider</text>
  </g>

  <!-- Hierarchy explanation -->
  <g transform="translate(430 684)">
    <rect x="0" y="0" width="570" height="200" rx="22" fill="#f8fafc" stroke="#d9e2ee"/>
    <text class="tag" x="24" y="31" fill="#52627a">PROJECT RULE</text>
    <text x="24" y="62" font-size="21" font-weight="850" fill="#172554">Capability → Skill → Tool → Implementation</text>
    <line x1="24" y1="79" x2="546" y2="79" stroke="#d8e2ef"/>
    <circle cx="34" cy="109" r="5" fill="#0f9f9a"/>
    <text x="51" y="114" font-size="13" font-weight="650" fill="#44546a">One Capability can group several Skills.</text>
    <circle cx="34" cy="141" r="5" fill="#7c5ce7"/>
    <text x="51" y="146" font-size="13" font-weight="650" fill="#44546a">A Skill routes execution through the appropriate Tool.</text>
    <circle cx="34" cy="173" r="5" fill="#f59e0b"/>
    <text x="51" y="178" font-size="13" font-weight="650" fill="#44546a">Skills are reused across agents and workflows.</text>
  </g>
  <g transform="translate(430 900)">
    <rect x="0" y="0" width="570" height="78" rx="18" fill="#172554"/>
    <text x="24" y="29" font-size="11" font-weight="850" letter-spacing="1" class="mutedWhite">BOUNDARY</text>
    <text x="24" y="53" font-size="13" font-weight="750" class="white">Implementation details never become the contract of a Capability or Skill.</text>
  </g>

  <!-- Tool gateway and services -->
  <text class="section" x="1060" y="582">04 · AUTHORIZED EXECUTION</text>
  <rect x="1060" y="602" width="470" height="416" rx="28" fill="#ffffff" stroke="#d8e2ef"/>
  <g transform="translate(1086 628)">
    <rect x="0" y="0" width="418" height="104" rx="22" fill="#fff7e8" stroke="#f4b64f"/>
    <rect x="20" y="20" width="52" height="52" rx="15" fill="#f59e0b"/>
    <path d="M34 46 h24 M46 34 v24" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <text class="tag" x="92" y="31" fill="#b66a00">TOOL GATEWAY</text>
    <text x="92" y="57" font-size="17" font-weight="850" fill="#172554">Single authorization point</text>
    <text class="cardText" x="92" y="79">subject · resource · scope · impact · consent</text>
  </g>
  <path class="connectorSoft" d="M1295 732 V760"/>
  <g transform="translate(1086 764)">
    <rect x="0" y="0" width="418" height="86" rx="20" fill="#fff4f5" stroke="#fecdd3"/>
    <text class="tag" x="20" y="28" fill="#be3455">POLICY CHECKPOINT</text>
    <text x="20" y="52" font-size="13" font-weight="750" fill="#334155">Rules, owner confirmation and emergency state</text>
    <text class="tiny" x="20" y="70">are evaluated immediately before sensitive execution.</text>
  </g>
  <path class="connectorSoft" d="M1295 850 V878"/>
  <g transform="translate(1086 882)">
    <rect x="0" y="0" width="128" height="96" rx="18" fill="#eefbf5" stroke="#9ad9bd"/>
    <text class="tag" x="16" y="28" fill="#16845b">SECRETS</text>
    <text class="tiny" x="16" y="51">minimum access</text>
    <text class="tiny" x="16" y="68">runtime delivery</text>
  </g>
  <g transform="translate(1231 882)">
    <rect x="0" y="0" width="128" height="96" rx="18" fill="#eff6ff" stroke="#a8c8ee"/>
    <text class="tag" x="16" y="28" fill="#2563eb">NETWORK</text>
    <text class="tiny" x="16" y="51">explicit routes</text>
    <text class="tiny" x="16" y="68">scoped endpoints</text>
  </g>
  <g transform="translate(1376 882)">
    <rect x="0" y="0" width="128" height="96" rx="18" fill="#f4f2ff" stroke="#b7a9ef"/>
    <text class="tag" x="16" y="28" fill="#7254d8">AUDIT</text>
    <text class="tiny" x="16" y="51">provenance</text>
    <text class="tiny" x="16" y="68">evidence trail</text>
  </g>

  <!-- Platform services strip -->
  <text class="section" x="70" y="1060">PLATFORM SERVICES</text>
  <g transform="translate(246 1033)">
    <rect x="0" y="0" width="278" height="54" rx="16" fill="#ffffff" stroke="#d8e2ef"/>
    <circle cx="26" cy="27" r="9" fill="#0f9f9a"/>
    <text x="46" y="23" font-size="11" font-weight="800">Context · Memory · Evidence</text>
    <text class="tiny" x="46" y="39">owner-visible canonical state</text>
  </g>
  <g transform="translate(542 1033)">
    <rect x="0" y="0" width="218" height="54" rx="16" fill="#ffffff" stroke="#d8e2ef"/>
    <circle cx="26" cy="27" r="9" fill="#7c5ce7"/>
    <text x="46" y="23" font-size="11" font-weight="800">Task State</text>
    <text class="tiny" x="46" y="39">resume · retry · dedupe</text>
  </g>
  <g transform="translate(778 1033)">
    <rect x="0" y="0" width="232" height="54" rx="16" fill="#ffffff" stroke="#d8e2ef"/>
    <circle cx="26" cy="27" r="9" fill="#f59e0b"/>
    <text x="46" y="23" font-size="11" font-weight="800">Operations</text>
    <text class="tiny" x="46" y="39">health · backup · restore</text>
  </g>
  <g transform="translate(1028 1033)">
    <rect x="0" y="0" width="244" height="54" rx="16" fill="#ffffff" stroke="#d8e2ef"/>
    <circle cx="26" cy="27" r="9" fill="#e11d48"/>
    <text x="46" y="23" font-size="11" font-weight="800">Owner Observability</text>
    <text class="tiny" x="46" y="39">state · cost · decisions</text>
  </g>
  <text x="1324" y="1065" font-size="10" font-weight="750" fill="#8090a6">editable SVG source · 1600×1120</text>
</svg>
