<svg xmlns="http://www.w3.org/2000/svg" width="1386" height="440" viewBox="0 0 1386 440" role="img" aria-labelledby="title desc">
  <title id="title">Шаблон процессной схемы</title>
  <desc id="desc">Минимальный структурно-полный скелет процессного профиля: действие, решение с двумя взаимоисключающими ветвями, результат/состояние, контролируемый исход и легенда. Скопируйте и замените плейсхолдеры реальным процессом.</desc>
  <!-- diagram-metadata
  diagram_id: process_diagram_template
  diagram_version: 1.1
  generated_at: 2026-09-02
  status: current
  source: operations/architecture/process_diagram_style_guide.md@1.0
  end-diagram-metadata -->
  <defs>
    <marker id="arrow-main" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315C88"/></marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A1463F"/></marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #17202D; }
      .title { font-size: 34px; font-weight: 600; }
      .subtitle { font-size: 15px; font-weight: 400; fill: #596574; }
      .component-title { font-size: 19px; font-weight: 600; }
      .component-text { font-size: 13px; font-weight: 400; fill: #53606E; }
      .node-title { font-size: 14px; font-weight: 600; }
      .decision-text { font-size: 12px; font-weight: 400; fill: #53606E; }
      .flow-text { font-size: 11px; font-weight: 600; fill: #315C88; }
      .control-flow-text { font-size: 11px; font-weight: 600; fill: #A1463F; }
      .legend { font-size: 12px; font-weight: 500; fill: #4E5A68; }
      .legend-section { font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #707B89; }
      .legend-heading { font-size: 14px; font-weight: 600; }
      .template-note { font-size: 11px; font-weight: 400; fill: #8792A0; }
      .gate-note { font-size: 10px; font-weight: 500; fill: #53606E; }
      .execution-card { fill: #F3F7FB; stroke: #315C88; stroke-width: 1.4; }
      .neutral-card { fill: #FFFFFF; stroke: #A7B0BB; stroke-width: 1.2; }
      .control-card { fill: #FFF6F5; stroke: #A1463F; stroke-width: 1.4; }
      .decision-node { fill: #FFFFFF; stroke: #A7B0BB; stroke-width: 1.2; }
      .flow-label { fill: #F3F7FB; stroke: #315C88; stroke-width: 0.9; }
      .flow-label-red { fill: #FFF6F5; stroke: #A1463F; stroke-width: 0.9; }
      .main-line { fill: none; stroke: #315C88; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-main); }
      .failure-line { fill: none; stroke: #A1463F; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-fail); }
    </style>
  </defs>
  <rect width="1386" height="440" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="40" y="44" class="title">Шаблон процессной схемы</text>
  <text x="40" y="72" class="subtitle">Скопируйте файл, переименуйте и замените плейсхолдеры реальным процессом</text>
  <text x="1087" y="90" text-anchor="end" class="gate-note" data-diagram-meta="version">Версия X.Y · Обновлено ГГГГ-ММ-ДД ЧЧ:ММ</text>
  <!-- Header rule stops before the legend column so its border does not
       coincide with the box's top edge at the same y (foundations §12). -->
  <line x1="40" y1="100" x2="1087" y2="100" stroke="#D7DCE2"/>

  <!-- Connectors first: each ends exactly on the boundary of its target (foundations §10) -->
  <path class="main-line" d="M237 220H297"/>
  <path class="main-line" d="M437 220H516"/>
  <path class="main-line" d="M746 220H806"/>
  <path class="failure-line" d="M367 265V330H516"/>

  <!-- Action node (verb form) -->
  <g>
    <rect x="40" y="186" width="197" height="68" rx="7" class="execution-card"/>
    <text x="138" y="225" class="node-title" text-anchor="middle">Выполнить действие</text>
  </g>

  <!-- Decision (XOR) -->
  <polygon points="367,175 437,220 367,265 297,220" class="decision-node"/>
  <text x="367" y="224" class="decision-text" text-anchor="middle">Успех?</text>

  <!-- «Да»: plaque centred on its connector, width = text + 2*space-m -->
  <rect x="457" y="206" width="39" height="28" rx="4" class="flow-label"/>
  <text x="476" y="224" class="flow-text" text-anchor="middle">Да</text>

  <g>
    <rect x="516" y="186" width="230" height="68" rx="7" class="execution-card"/>
    <text x="631" y="225" class="node-title" text-anchor="middle">Зафиксировать результат</text>
  </g>

  <!-- Result / state node -->
  <g>
    <rect x="806" y="186" width="241" height="68" rx="7" class="neutral-card"/>
    <text x="926" y="216" class="component-title" text-anchor="middle">Результат: сохранён</text>
    <text x="926" y="238" class="component-text" text-anchor="middle">Плейсхолдер состояния</text>
  </g>

  <!-- «Нет»: exclusive alternative with its own controlled outcome -->
  <rect x="345" y="284" width="44" height="28" rx="4" class="flow-label-red"/>
  <text x="367" y="302" class="control-flow-text" text-anchor="middle">Нет</text>

  <g>
    <rect x="516" y="296" width="280" height="68" rx="7" class="control-card"/>
    <text x="656" y="326" class="component-title" text-anchor="middle">Отменено</text>
    <text x="656" y="348" class="component-text" text-anchor="middle">Контролируемый исход (плейсхолдер)</text>
  </g>

  <!-- Legend -->
  <g>
    <rect x="1107" y="100" width="239" height="254" rx="7" fill="#FAFBFC" stroke="#D7DCE2" stroke-width="1"/>
    <text x="1135" y="137" class="legend-heading">Легенда</text>
    <text x="1135" y="172" class="legend-section">ОБЪЕКТЫ</text>
    <rect x="1135" y="188" width="18" height="14" rx="2" fill="#F3F7FB" stroke="#315C88"/>
    <text x="1165" y="199" class="legend">Действие / состояние</text>
    <rect x="1135" y="218" width="18" height="14" rx="2" fill="#FFF6F5" stroke="#A1463F"/>
    <text x="1165" y="229" class="legend">Контролируемый исход</text>
    <text x="1135" y="268" class="legend-section">ЛИНИИ</text>
    <line x1="1135" y1="293" x2="1175" y2="293" stroke="#315C88" stroke-width="1" marker-end="url(#arrow-main)"/>
    <text x="1187" y="297" class="legend">Переход</text>
    <line x1="1135" y1="323" x2="1175" y2="323" stroke="#A1463F" stroke-width="1" marker-end="url(#arrow-fail)"/>
    <text x="1187" y="327" class="legend">Контролируемый исход</text>
  </g>

  <text x="40" y="414" class="template-note">Шаблон — заполните названия узлов, условия ветвлений и подписи реальным процессом перед публикацией; см. process_diagram_style_guide.md.</text>
</svg>
