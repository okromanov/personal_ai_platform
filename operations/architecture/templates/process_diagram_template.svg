<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Шаблон процессной схемы</title>
  <desc id="desc">Минимальный структурно-полный скелет процессного профиля: действие, решение с двумя взаимоисключающими ветвями, результат/состояние, легенда. Скопируйте и замените плейсхолдеры реальным процессом.</desc>
  <!-- diagram-metadata
  diagram_id: process_diagram_template
  diagram_version: 1.0
  generated_at: 2026-09-02
  status: current
  source: operations/architecture/process_diagram_style_guide.md@1.0
  end-diagram-metadata -->
  <defs>
    <marker id="arrow-main" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315C88"/></marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A1463F"/></marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #17202D; }
      .title { font-size: 34px; font-weight: 600; }
      .subtitle { font-size: 15px; font-weight: 400; fill: #596574; }
      .component-title { font-size: 19px; font-weight: 600; }
      .component-text { font-size: 13px; font-weight: 400; fill: #53606E; }
      .node-title { font-size: 14px; font-weight: 600; }
      .decision-text { font-size: 12px; font-weight: 400; fill: #53606E; }
      .flow-text { font-size: 11px; font-weight: 600; fill: #315C88; }
      .control-flow-text { font-size: 11px; font-weight: 600; fill: #A1463F; }
      .legend { font-size: 12px; font-weight: 500; fill: #4E5A68; }
      .legend-section { font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #707B89; }
      .legend-heading { font-size: 14px; font-weight: 600; }
      .template-note { font-size: 11px; font-weight: 400; fill: #8792A0; }
      .execution-card { fill: #F3F7FB; stroke: #315C88; stroke-width: 1.4; }
      .neutral-card { fill: #FFFFFF; stroke: #A7B0BB; stroke-width: 1.2; }
      .control-card { fill: #FFF6F5; stroke: #A1463F; stroke-width: 1.4; }
      .decision-node { fill: #FFFFFF; stroke: #A7B0BB; stroke-width: 1.2; }
      .flow-label { fill: #F3F7FB; stroke: #315C88; stroke-width: 0.9; }
      .flow-label-red { fill: #FFF6F5; stroke: #A1463F; stroke-width: 0.9; }
      .main-line { fill: none; stroke: #315C88; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-main); }
      .failure-line { fill: none; stroke: #A1463F; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-fail); }
    </style>
  </defs>
  <rect width="1200" height="380" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="40" y="44" class="title">Шаблон процессной схемы</text>
  <text x="40" y="72" class="subtitle">Скопируйте файл, переименуйте и замените плейсхолдеры реальным процессом</text>
  <line x1="40" y1="100" x2="1160" y2="100" stroke="#D7DCE2"/>

  <!-- Legend -->
  <g>
    <rect x="980" y="100" width="190" height="220" rx="7" fill="#FAFBFC" stroke="#D7DCE2" stroke-width="1"/>
    <text x="1000" y="124" class="legend-heading">Легенда</text>
    <text x="1000" y="150" class="legend-section">ОБЪЕКТЫ</text>
    <rect x="1000" y="164" width="18" height="14" rx="2" fill="#F3F7FB" stroke="#315C88"/><text x="1030" y="176" class="legend">Действие / состояние</text>
    <rect x="1000" y="194" width="18" height="14" rx="2" fill="#FFF6F5" stroke="#A1463F"/><text x="1030" y="206" class="legend">Контролируемый исход</text>
    <text x="1000" y="238" class="legend-section">ЛИНИИ</text>
    <line x1="1000" y1="258" x2="1040" y2="258" stroke="#315C88" stroke-width="1" marker-end="url(#arrow-main)"/><text x="1054" y="262" class="legend">Переход</text>
    <line x1="1000" y1="288" x2="1040" y2="288" stroke="#A1463F" stroke-width="1" marker-end="url(#arrow-fail)"/><text x="1054" y="292" class="legend">Контролируемый исход</text>
  </g>

  <!-- Action node (verb form) -->
  <g>
    <rect x="40" y="190" width="160" height="60" rx="7" class="execution-card"/>
    <text x="120" y="224" class="node-title" text-anchor="middle">Выполнить действие</text>
  </g>
  <path class="main-line" d="M200 220H270"/>

  <!-- Decision (XOR) -->
  <polygon points="280,175 350,220 280,265 210,220" class="decision-node"/>
  <text x="280" y="224" class="decision-text" text-anchor="middle">Успех?</text>

  <!-- Да branch: continues the main flow -->
  <path class="main-line" d="M350 220H410"/>
  <rect x="363" y="206" width="34" height="28" rx="4" class="flow-label"/>
  <text x="380" y="224" class="flow-text" text-anchor="middle">Да</text>

  <g>
    <rect x="410" y="190" width="190" height="60" rx="7" class="execution-card"/>
    <text x="505" y="224" class="node-title" text-anchor="middle">Зафиксировать результат</text>
  </g>
  <path class="main-line" d="M600 220H660"/>

  <!-- Result / state node -->
  <g>
    <rect x="660" y="190" width="170" height="60" rx="7" class="neutral-card"/>
    <text x="745" y="216" class="component-title" text-anchor="middle">Результат: сохранён</text>
    <text x="745" y="234" class="component-text" text-anchor="middle">Плейсхолдер состояния</text>
  </g>

  <!-- Нет branch: exclusive alternative, own controlled outcome -->
  <path class="failure-line" d="M280 265V311H480"/>
  <rect x="262" y="274" width="36" height="28" rx="4" class="flow-label-red"/>
  <text x="280" y="292" class="control-flow-text" text-anchor="middle">Нет</text>

  <g>
    <rect x="480" y="280" width="190" height="60" rx="7" class="control-card"/>
    <text x="575" y="306" class="component-title" text-anchor="middle">Отменено</text>
    <text x="575" y="324" class="component-text" text-anchor="middle">Контролируемый исход (плейсхолдер)</text>
  </g>

  <text x="40" y="364" class="template-note">Шаблон — заполните названия узлов, условия ветвлений и подписи реальным процессом перед публикацией; см. diagram_geometry_foundations.md §15.1.</text>
</svg>
