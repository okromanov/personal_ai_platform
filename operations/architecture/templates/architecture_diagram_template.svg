<svg xmlns="http://www.w3.org/2000/svg" width="991" height="644" viewBox="0 0 991 644" role="img" aria-labelledby="title desc" data-diagram-kind="architecture">
  <title id="title">Шаблон архитектурной схемы</title>
  <desc id="desc">Минимальный структурно-полный скелет архитектурного профиля: карточка компонента с вложенным объектом, коннектор с плашкой подписи, узел результата и легенда. Скопируйте и замените плейсхолдеры реальными ID и содержимым.</desc>
