  source: operations/architecture/diagram_geometry_foundations.md@1.18
  end-diagram-metadata -->
  <defs>
    <marker id="arrow-main" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315C88"/></marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #17202D; }
      .title { font-size: 34px; font-weight: 600; }
      .subtitle { font-size: 15px; font-weight: 400; fill: #596574; }
      .component-id { font-size: 11px; font-weight: 600; letter-spacing: 0.8px; fill: #687482; }
      .component-title { font-size: 19px; font-weight: 600; }
      .component-text { font-size: 13px; font-weight: 400; fill: #53606E; }
      .nested-title { font-size: 14px; font-weight: 600; }
      .nested-text { font-size: 12px; font-weight: 400; fill: #5E6875; }
      .flow-text { font-size: 11px; font-weight: 600; fill: #315C88; }
      .legend { font-size: 12px; font-weight: 500; fill: #4E5A68; }
      .legend-section { font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #707B89; }
      .legend-id { font-size: 11px; font-weight: 600; letter-spacing: 0.5px; fill: #566271; }
      .legend-heading { font-size: 14px; font-weight: 600; }
      .template-note { font-size: 11px; font-weight: 400; fill: #8792A0; }
      .gate-note { font-size: 10px; font-weight: 500; fill: #53606E; }
      .execution-card { fill: #F3F7FB; stroke: #315C88; stroke-width: 1.4; }
      .control-card { fill: #FFF6F5; stroke: #A1463F; stroke-width: 1.4; }
      .neutral-card { fill: #FFFFFF; stroke: #A7B0BB; stroke-width: 1.2; }
      .inner-card { fill: #FFFFFF; stroke: #D1D7DE; stroke-width: 1; }
      .flow-label-blue { fill: #F3F7FB; stroke: #315C88; stroke-width: 0.9; }
      .main-line { fill: none; stroke: #315C88; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-main); }
    </style>
    <!-- Non-rendered geometry reference for wrapped flow labels. It lives in
         the SVG template, not in Python constants, and is measured by lint. -->
    <g id="template-multiline-label-reference">
      <path id="template-multiline-flow" class="main-line" d="M100 -20V0" data-shared-route="true" data-route="direct"/>
      <rect id="template-flow-label-multiline" x="20" y="0" width="160" height="44" rx="4" class="flow-label-blue" data-connector-ref="template-multiline-flow" data-layout="flow-label-multiline" data-padding-profile="flow-caption"/>
      <text x="100" y="17" class="template-note" text-anchor="middle" data-label-for="template-flow-label-multiline">Первая строка подписи</text>
      <text x="100" y="33" class="template-note" text-anchor="middle" data-label-for="template-flow-label-multiline">Вторая строка подписи</text>
    </g>
  </defs>
  <rect width="991" height="644" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="40" y="44" class="title">Шаблон архитектурной схемы</text>
  <text x="40" y="72" class="subtitle">Скопируйте файл, переименуйте и замените плейсхолдеры реальным содержимым</text>
  <text x="640" y="90" text-anchor="end" class="gate-note" data-diagram-meta="version">Версия X.Y · Обновлено ГГГГ-ММ-ДД ЧЧ:ММ</text>
  <!-- Header rule stops before the legend column so its border does not
       coincide with the box's top edge at the same y (foundations §12:
       legend top aligns WITH the header line, it does not sit ON it). -->
  <line x1="40" y1="100" x2="640" y2="100" stroke="#D7DCE2"/>

  <!-- Connector drawn before the nodes it links (foundations §10) -->
  <!-- A shared bus/rail segment marked data-shared-route="true" must stop at
       a card boundary. The outgoing segment starts there with data-source-ref
       and therefore inherits the source card's colour. Repeated independent
       control transitions use data-layout="control-transition" on the rect
       and matching identity/title/detail-1/detail-2 data-layout-slot values
       on centred text rows; diagram_lint compares them with this template. -->
  <path id="template-main-flow" class="main-line" d="M320 320V388" data-source-ref="template-component" data-route="direct"/>
  <!-- Two independent connectors entering one side of a card define the
       template-derived side-port interval. Production diagrams group the
       corresponding connectors with the same data-port-group value. -->
  <path class="main-line" d="M620 220H600" data-shared-route="true" data-route="direct" data-port-group="template-right-inputs" data-port-target="template-component" data-port-side="right"/>
  <path class="main-line" d="M620 252H600" data-shared-route="true" data-route="direct" data-port-group="template-right-inputs" data-port-target="template-component" data-port-side="right"/>

  <!-- Component card: ID -> title -> short description -> nested object -->
  <g>
    <rect id="template-component" x="40" y="140" width="560" height="180" rx="7" class="execution-card"/>
    <text x="68" y="174" class="component-id">ARC_CMP_XXX</text>
    <text x="68" y="199" class="component-title">Название компонента (плейсхолдер)</text>
    <text x="68" y="223" class="component-text">Краткое функциональное описание компонента</text>
    <rect x="68" y="246" width="193" height="58" rx="4" class="inner-card"/>
    <text x="80" y="271" class="nested-title">Внутренний узел</text>
    <text x="80" y="289" class="nested-text">Пример вложенного элемента</text>
  </g>

  <!-- Flow label: width = text + 2*space-m, centred on the connector -->
  <rect id="template-flow-label" x="234" y="340" width="172" height="28" rx="4" class="flow-label-blue" data-gap-from="template-component" data-gap-kind="transition" data-connector-ref="template-main-flow" data-layout="flow-label" data-padding-profile="flow-caption"/>
  <text x="320" y="359" class="flow-text" text-anchor="middle" data-label-for="template-flow-label">ARC_FLOW_XXX · Поток</text>

  <!-- Result / port node: 388 - (140 + 180) = layer-gap. The flow label
       above also defines transition-gap geometrically: 340 - 320 = 20.
       Expected intervals are calculated and never duplicated as numbers. -->
  <g>
    <rect id="template-result" x="40" y="388" width="560" height="92" rx="7" class="neutral-card" data-gap-from="template-component"/>
    <text x="68" y="429" class="component-title">Результат или порт (плейсхолдер)</text>
    <text x="68" y="453" class="component-text">Контракт результата или выходной порт</text>
  </g>

  <!-- Standalone unnumbered control transition. Its compact card is centred
       on the main column; text baselines are the calculated layout
       reference for every data-layout="control-transition" card. -->
  <g>
    <rect id="template-control-transition" x="100" y="500" width="440" height="96" rx="7" class="control-card" data-gap-from="template-result" data-gap-kind="transition" data-layout="control-transition" data-center-with="template-component"/>
    <text x="320" y="520" class="component-id" text-anchor="middle" data-layout-slot="identity">ARC_CMP_XXX · КОНТРОЛЬНЫЙ ПЕРЕХОД</text>
    <text x="320" y="545" class="component-title" text-anchor="middle" data-layout-slot="title">Название контрольного перехода</text>
    <text x="320" y="568" class="component-text" text-anchor="middle" data-layout-slot="detail-1">Первое пояснение решения или ограничения</text>
    <text x="320" y="584" class="component-text" text-anchor="middle" data-layout-slot="detail-2">Второе пояснение решения или ограничения</text>
  </g>

  <!-- Legend -->
  <g>
    <rect x="660" y="100" width="291" height="292" rx="7" fill="#FAFBFC" stroke="#D7DCE2" stroke-width="1"/>
    <text x="688" y="137" class="legend-heading">Легенда</text>
    <text x="688" y="172" class="legend-section">ОБЪЕКТЫ</text>
    <rect x="688" y="188" width="18" height="14" rx="2" fill="#F3F7FB" stroke="#315C88"/>
    <text x="718" y="199" class="legend">Исполнение и проверка</text>
    <rect x="688" y="218" width="18" height="14" rx="2" fill="#FFFFFF" stroke="#A7B0BB"/>
    <text x="718" y="229" class="legend">Граничные и поддерживающие узлы</text>
    <text x="688" y="268" class="legend-section">ЛИНИИ</text>
    <line x1="688" y1="293" x2="728" y2="293" stroke="#315C88" stroke-width="1" marker-end="url(#arrow-main)"/>
    <text x="740" y="297" class="legend">Ход задачи</text>
    <text x="688" y="336" class="legend-section">ИДЕНТИФИКАТОРЫ</text>
    <text x="688" y="364" class="legend-id">ARC_CMP_*</text>
    <text x="770" y="365" class="legend">Логический компонент</text>
  </g>

  <text x="40" y="624" class="template-note">Шаблон — заполните ID, названия и описания реальным содержимым перед публикацией; см. diagram_geometry_foundations.md §15.1.</text>
</svg>
