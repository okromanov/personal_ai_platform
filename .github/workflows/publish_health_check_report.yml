name: Publish health check report

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message != 'chore(generated): refresh health check report'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quality tools
        run: python -m pip install --disable-pip-version-check -r operations/quality/requirements_dev.txt

      - name: Build report from the merged revision
        run: |
          python operations/scripts/quality/run_suite.py full
          python operations/scripts/health_check/generate.py --output generated/health_check_report.md

      - name: Commit report when it changed
        run: |
          if git diff --quiet -- generated/health_check_report.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/health_check_report.md
          git commit -m "chore(generated): refresh health check report"
          git push
