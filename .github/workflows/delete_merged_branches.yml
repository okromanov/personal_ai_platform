name: Delete merged branches

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: delete-merged-branches
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete merged branches
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete branches whose pull requests were merged
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          api_url = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          owner = repository.split("/", 1)[0]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path):
              req = Request(f"{api_url}{path}", method=method, headers=headers)
              try:
                  with urlopen(req, timeout=30) as response:
                      payload = response.read()
              except HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API {method} {path}: {exc.code} {detail}") from exc
              return json.loads(payload) if payload else None

          repository_data = request("GET", f"/repos/{repository}")
          default_branch = repository_data["default_branch"]
          branches = []
          page = 1
          while True:
              batch = request("GET", f"/repos/{repository}/branches?per_page=100&page={page}")
              branches.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          # Удаляются ветки любого префикса, а не только codex/*. Границу
          # держат четыре условия ниже, а не имя ветки: это не ветка по
          # умолчанию, у неё сейчас нет открытого pull request, и её ТЕКУЩИЙ
          # tip-коммит (а не когда-либо в прошлом) буквально совпадает с
          # head.sha одного из слитых pull request для этого имени.
          #
          # Имя ветки переиспользуется (тот же branch name перезапускается от
          # main после слияния — см. process в AGENTS.md), поэтому у одного
          # имени накапливается история из нескольких pull request. Проверка
          # только "нет открытого PR сейчас" + "есть хоть один слитый PR в
          # истории" всё ещё недостаточна: если после слияния кто-то запушил
          # новые коммиты в переиспользуемую ветку, но ещё не успел открыть
          # новый PR, ветка не имеет открытого PR, а старый слитый PR под тем
          # же именем всё ещё матчится — и эти новые, никогда не прошедшие
          # через pull request коммиты удаляются вместе с веткой. Сравнение
          # tip-коммита ветки с head.sha слитого PR закрывает это: удаляется
          # только та ветка, чьё текущее состояние буквально то же самое, что
          # уже было слито, — никогда неслитые коммиты поверх него.
          for branch in branches:
              name = branch["name"]
              if name == default_branch or branch.get("protected"):
                  continue
              head = quote(f"{owner}:{name}", safe="")
              pulls = request(
                  "GET",
                  f"/repos/{repository}/pulls?state=all&head={head}&per_page=100",
              )
              if any(pull.get("state") == "open" for pull in pulls):
                  continue
              branch_sha = branch.get("commit", {}).get("sha")
              merged_head_shas = {
                  pull.get("head", {}).get("sha") for pull in pulls if pull.get("merged_at")
              }
              if not branch_sha or branch_sha not in merged_head_shas:
                  continue
              encoded_ref = quote(f"heads/{name}", safe="/")
              print(f"Deleting merged branch: {name}")
              request("DELETE", f"/repos/{repository}/git/refs/{encoded_ref}")
