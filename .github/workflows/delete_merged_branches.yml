name: Delete merged branches

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: delete-merged-branches
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete merged branches
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete branches whose pull requests were merged
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          api_url = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          owner = repository.split("/", 1)[0]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path):
              req = Request(f"{api_url}{path}", method=method, headers=headers)
              try:
                  with urlopen(req, timeout=30) as response:
                      payload = response.read()
              except HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API {method} {path}: {exc.code} {detail}") from exc
              return json.loads(payload) if payload else None

          repository_data = request("GET", f"/repos/{repository}")
          default_branch = repository_data["default_branch"]
          branches = []
          page = 1
          while True:
              batch = request("GET", f"/repos/{repository}/branches?per_page=100&page={page}")
              branches.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          # Удаляются ветки любого префикса, а не только codex/*. Границу
          # держат три условия ниже, а не имя ветки: это не ветка по умолчанию,
          # GitHub подтверждает для неё слитый pull request, и у неё сейчас нет
          # открытого pull request. Последнее условие обязательно: имя ветки
          # переиспользуется (тот же branch name перезапускается от main после
          # слияния — см. process в AGENTS.md), поэтому старый закрытый+слитый
          # PR с тем же head остаётся в истории и без явной проверки на "нет
          # открытого PR сейчас" ветка с новым открытым PR удаляется тоже —
          # это и произошло на практике (issue: удалена ветка под открытым PR
          # только из-за более раннего слитого PR с тем же именем).
          for branch in branches:
              name = branch["name"]
              if name == default_branch or branch.get("protected"):
                  continue
              head = quote(f"{owner}:{name}", safe="")
              pulls = request(
                  "GET",
                  f"/repos/{repository}/pulls?state=all&head={head}&per_page=100",
              )
              if any(pull.get("state") == "open" for pull in pulls):
                  continue
              if not any(pull.get("merged_at") for pull in pulls):
                  continue
              encoded_ref = quote(f"heads/{name}", safe="/")
              print(f"Deleting merged branch: {name}")
              request("DELETE", f"/repos/{repository}/git/refs/{encoded_ref}")
