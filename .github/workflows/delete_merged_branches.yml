name: Delete merged branches

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: delete-merged-branches
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete merged branches
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete branches whose pull requests were merged
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          api_url = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          owner = repository.split("/", 1)[0]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path):
              req = Request(f"{api_url}{path}", method=method, headers=headers)
              try:
                  with urlopen(req, timeout=30) as response:
                      payload = response.read()
              except HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API {method} {path}: {exc.code} {detail}") from exc
              return json.loads(payload) if payload else None

          repository_data = request("GET", f"/repos/{repository}")
          default_branch = repository_data["default_branch"]
          branches = []
          page = 1
          while True:
              batch = request("GET", f"/repos/{repository}/branches?per_page=100&page={page}")
              branches.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          # Удаляются ветки любого префикса, а не только codex/*. Границу
          # держат два условия ниже, а не имя ветки: это не ветка по умолчанию,
          # и GitHub подтверждает для неё слитый pull request. Защищённая ветка
          # без слитого PR под это не подпадает.
          for branch in branches:
              name = branch["name"]
              if name == default_branch or branch.get("protected"):
                  continue
              head = quote(f"{owner}:{name}", safe="")
              pulls = request(
                  "GET",
                  f"/repos/{repository}/pulls?state=closed&head={head}&per_page=100",
              )
              if not any(pull.get("merged_at") for pull in pulls):
                  continue
              encoded_ref = quote(f"heads/{name}", safe="/")
              print(f"Deleting merged branch: {name}")
              request("DELETE", f"/repos/{repository}/git/refs/{encoded_ref}")
